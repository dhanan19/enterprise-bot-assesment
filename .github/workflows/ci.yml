
name: Helm and Image Security CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chart-lint:
    name: Lint Helm chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Lint chart
        run: helm lint ./broken-chart

      - name: Validate rendered Kubernetes manifests
        run: helm template debug-lab ./broken-chart --namespace debug-lab

  image-security:
    name: Build and scan container image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: ./service
          file: ./service/Dockerfile
          tags: local/app:${{ github.sha }}
          load: true
          push: false

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: local/app:${{ github.sha }}
          scan-type: image
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
