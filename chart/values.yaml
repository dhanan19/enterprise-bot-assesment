replicaCount: 2

image:
  repository: demo-app
  tag: "1.0.0"
  # kind-loaded image: must not try to pull from a registry
  pullPolicy: IfNotPresent

config:
  appName: demo
  version: "1.0.0"

service:
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: demo.local

# Where the ConfigMap is also mounted as files, so edits to the ConfigMap
# show up in running pods without a restart (env vars are frozen at start).
configMount:
  path: /etc/app-config

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    initialDelaySeconds: 2
    periodSeconds: 5
